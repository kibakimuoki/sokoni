/* ===== storefront (Amazon-style) ===== */
:root { --hdr:#13422d; --hdr2:#1c5b3d; --cta:#ffcf33; --cta-d:#f2b705; }
.top { display:block; padding:0; background:var(--hdr); }
.top-row { display:flex; align-items:center; gap:10px; padding:max(8px,env(safe-area-inset-top)) 14px 8px; max-width:1520px; margin:0 auto; flex-wrap:wrap; }

.search select { border:0; border-right:1px solid #cfd4d2; background:#eef1ef; color:#2c3a32; font-size:13px; padding:0 8px; max-width:104px; min-width:56px; outline:none; border-radius:0; }
.search input { flex:1; min-width:0; border:0; outline:none; padding:0 12px; font-size:15px; color:#111; background:#fff; border-radius:0; }
.search button { width:48px; border:0; background:var(--cta); color:#13220f; display:flex; align-items:center; justify-content:center; } .search button:hover { background:var(--cta-d); }
.acct { position:relative; background:transparent; border:1px solid transparent; border-radius:6px; color:#fff; text-align:left; line-height:1.15; padding:4px 8px; flex-direction:column; align-items:flex-start; gap:0; font-weight:400; }
.acct small { display:block; font-size:11.5px; font-weight:400; opacity:.9; } .acct b { font-size:14px; font-weight:700; } .acct .badge { position:absolute; top:-2px; right:2px; background:var(--cta); color:#13220f; border-radius:999px; font-size:11px; font-weight:800; padding:1px 6px; }
#ordersBtn, #msgBtn { display:none !important; }

  .hamb { display:none !important; } .deliver { display:block; } .search { flex:1 1 360px; order:0; }
  .search select { max-width:130px; } #ordersBtn, #msgBtn { display:flex !important; } 
  .top-row { flex-wrap:nowrap; padding:8px 18px; } .subnav { padding:0 14px; } .subnav .all { padding-left:6px; } .logo { font-size:26px; } .top .chip-btn#langBtn { background:transparent; border:1px solid transparent; border-radius:6px; } .top .chip-btn#langBtn:hover { border-color:#fff; }

  const handler = (e) => { const el = e.target.closest("[data-act]"); if (!el || (el.tagName === "INPUT" && el.type === "radio" && e.type === "click" && false)) return; act(el.dataset.act, el, e).catch((er) => toast(er.message, true)); };
