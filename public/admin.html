<!DOCTYPE html>
<html lang="en"><head><meta name="sokoni-build" content="202611141128"><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sokoni Operations</title>
<style>
  :root { --brand:#1f6f43; --bg:#f3f1ea; --card:#fff; --ink:#18241c; --muted:#6a7268; --line:#e4e1d6; --red:#c0362c; --amber:#b57614; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1712; --card:#17211a; --ink:#e9efe9; --muted:#97a398; --line:#263228; --brand:#4cb17a; --red:#f0766c; --amber:#e0aa5a; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 Inter,system-ui,sans-serif; } header { background:var(--brand); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap } header b { font-size:18px }
  nav { display:flex; gap:4px; flex-wrap:wrap; margin-left:12px } nav button { background:rgba(255,255,255,.14); color:#fff; border:0; padding:8px 14px; border-radius:10px; font-weight:600; cursor:pointer } nav button.on { background:#fff; color:var(--brand) } .sp { flex:1 }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; align-items:start } .grid2 > .card { margin:0 }
  main { max-width:1180px; margin:0 auto; padding:18px } .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px } .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px }
  .stat .l { color:var(--muted); font-size:12.5px; font-weight:600 } .stat .v { font-size:26px; font-weight:800; margin:2px 0 } .stat .s { color:var(--muted); font-size:12.5px } .bad .v { color:var(--red) } .warn .v { color:var(--amber) }
  table { width:100%; border-collapse:collapse } th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top } th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em } tr:last-child td { border:0 }
  .chip { display:inline-block; font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--line); color:var(--muted) } .chip.g { background:#e3f1e8; color:#165232 } .chip.a { background:#fff1dc; color:#8a5a00 } .chip.r { background:#fde6e2; color:var(--red) }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px } .tabs button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px; border-radius:99px; font-weight:600; cursor:pointer } .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand) }
  button.act { border:0; background:var(--brand); color:#fff; padding:7px 13px; border-radius:9px; font-weight:700; cursor:pointer; margin:4px 6px 0 0 } button.act.red { background:var(--red) } button.act.ghost { background:transparent; color:var(--ink); border:1px solid var(--line) }
  input { padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); width:340px; max-width:100% } .muted { color:var(--muted); font-size:13px } .note { background:#e3f1e8; color:#165232; border-radius:12px; padding:10px 14px; margin-bottom:14px } .imgs { display:flex; gap:6px; overflow:auto } .imgs img { height:90px; border-radius:8px } pre { white-space:pre-wrap; margin:0; font:inherit }
</style></head><body>
<div id="bldwarn" style="display:none;background:#fde8e8;color:#8a1c1c;padding:10px 16px;font-weight:600"></div><header><b>🍅 Sokoni Operations</b> <small id="bld" style="font-weight:400;opacity:.65;margin-inline-start:6px"></small><nav id="nav"></nav><div class="sp"></div><span id="who" class="muted" style="color:#fff;opacity:.8"></span></header>
<main id="m"></main>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { rd: "pending", tab: "overview", pay: "successful", pout: "pending", co: "pending", tok: sessionStorage.getItem("sk_admin") || "" }; const $ = (id) => document.getElementById(id);
const api = async (p, o = {}) => { const r = await fetch("/api/admin" + p, { ...o, headers: { "Content-Type": "application/json", "x-admin-token": S.tok } }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || r.status); return d; };
const money = (n, c) => { try { return new Intl.NumberFormat(undefined, { style: "currency", currency: c, currencyDisplay: "code" }).format(n); } catch (e) { return c + " " + n; } };
const bycur = (m) => Object.entries(m || {}).map(([c, a]) => money(a, c)).join(" · ") || "—"; const usd = (v) => (v == null ? "" : "≈ " + money(v, "USD"));
const when = (iso) => (iso ? new Date(iso).toLocaleString() : "—"); const tone = { escrowed: "g", paid_out: "g", payout_initiated: "g", payout_pending: "a", pending: "a", payout_failed: "r", failed: "r", refunded: "", refunding: "a" };
const TABS = [["overview", "Overview"], ["setup", "Payment setup"], ["payments", "Payments"], ["payouts", "Payouts"], ["economics", "Economics"], ["analytics", "Analytics"], ["ratings", "Ratings"], ["disputes", "Disputes"], ["companies", "Companies"], ["riders", "Riders"], ["users", "Users"], ["reviews", "Listing reviews"], ["providers", "Providers"]];
function nav() { $("nav").innerHTML = TABS.map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" onclick="S.tab='${k}';draw()">${l}</button>`).join(""); }
async function draw() {
  nav(); const m = $("m"); if (!S.tok) { m.innerHTML = `<div class="card" style="max-width:420px;margin:60px auto"><h2>Operations sign-in</h2><p class="muted">Enter the ADMIN_TOKEN from your settings file (the line that starts with <code>ADMIN_TOKEN=</code>). Type it exactly: capital letters count, and if it begins with a <b>#</b>, that # is part of it.</p><input id="tk" type="password" placeholder="Admin token"> <button class="act" onclick="S.tok=$('tk').value;sessionStorage.setItem('sk_admin',S.tok);draw()">Sign in</button></div>`; return; }
  try { m.innerHTML = await VIEWS[S.tab](); if (typeof afterView === "function") afterView(); loadRiderPhotos(); loadClaimReceipts(); } catch (e) { if (/token/i.test(e.message)) { S.tok = ""; sessionStorage.removeItem("sk_admin"); return draw(); } m.innerHTML = `<div class="card" style="color:var(--red)">${esc(e.message)}</div>`; }
}
const stat = (l, v, s, cls = "") => `<div class="card stat ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s || ""}</div></div>`;
const orderRow = (o, extra = "") => `<tr><td><b>${esc(o.crop)}</b><div class="muted">${esc(o.id.slice(0, 8))}</div></td><td>${esc(money(o.amount, o.currency))}<div class="muted">payout ${esc(money(o.sellerPayout, o.currency))}</div></td><td><span class="chip ${tone[o.paymentStatus] || ""}">${esc(o.paymentStatus.replace(/_/g, " "))}</span>${o.disputed ? ' <span class="chip r">dispute</span>' : ""}</td><td>${esc(o.provider || "—")}${o.method ? `<div class="muted">${esc(o.method)}</div>` : ""}</td><td>${esc(o.buyer)}<div class="muted">→ ${esc(o.seller)}</div></td><td>${esc(when(o.escrowedAt || o.pendingSince || o.createdAt))}</td>${extra}</tr>`;
const head = "<tr><th>Order</th><th>Amount</th><th>Status</th><th>Via</th><th>Buyer → Seller</th><th>When</th>";
const VIEWS = {
  async overview() { const o = await api("/overview");
    return `<div class="note">✅ Payments are verified automatically by the payment providers, funds are held against each order, and sellers are paid automatically after the buyer accepts. You only need to step in for disputes and exceptions.</div><div class="grid">
      ${stat("Active orders", o.activeOrders)}${stat("Payments today", o.paymentsToday.count, esc(bycur(o.paymentsToday.byCurrency)) + " " + usd(o.paymentsToday.usd))}${stat("GMV (all time)", esc(o.gmv.usd != null ? money(o.gmv.usd, "USD") : bycur(o.gmv.byCurrency)), esc(bycur(o.gmv.byCurrency)))}${stat("Funds currently held", o.fundsHeld.count + " orders", esc(bycur(o.fundsHeld.byCurrency)) + " " + usd(o.fundsHeld.usd))}
      ${stat("Payouts pending", o.payoutsPending.count, esc(bycur(o.payoutsPending.byCurrency)) + (o.payoutsPending.failed ? " · " + o.payoutsPending.failed + " failed" : ""), o.payoutsPending.failed ? "bad" : "")}${stat("Platform fees earned", esc(bycur(o.platformFees.byCurrency)), usd(o.platformFees.usd))}${stat("Deliveries in progress", o.deliveriesInProgress)}${stat("Open disputes", o.openDisputes, o.openDisputes ? "needs a decision" : "all clear", o.openDisputes ? "warn" : "")}${stat("Bank transfers awaiting arrival", o.wiresAwaiting, o.wiresAwaiting ? "confirm when the money shows in your bank" : "none", o.wiresAwaiting ? "warn" : "")}${stat("Riders awaiting vehicle check", o.riderReviews, o.riderReviews ? "photos to review" : "all clear", o.riderReviews ? "warn" : "")}${stat("Companies awaiting verification", o.companyReviews, o.companyReviews ? "documents to review" : "all clear", o.companyReviews ? "warn" : "")}${stat("Listings awaiting review", o.listingReviews, "flagged by trust checks", o.listingReviews ? "warn" : "")}</div>${o.fxAvailable ? "" : '<p class="muted">USD equivalents unavailable (no exchange-rate data).</p>'}`; },
  async setup() { const [r, st] = await Promise.all([api("/readiness"), api("/settings")]); const dot = (b) => `<span class="chip ${b ? "g" : ""}">${b ? "ready" : "needs setup"}</span>`;
    const tiles = `<div class="grid">${r.methods.map((m) => `<div class="card" style="border-left:5px solid ${m.partial ? "#d99a00" : m.ready ? "#2e8b57" : "var(--red)"}"><div style="font-size:26px">${m.icon}</div><b>${esc(m.label)}</b> ${m.partial ? '<span class="chip a">✓ Pay Bill ready · PIN prompt needs setup</span>' : m.ready ? '<span class="chip g">✓ ready to receive money</span>' : '<span class="chip r">needs setup</span>'}${m.mode ? ` <span class="chip ${m.mode === "live" ? "g" : "a"}">${m.mode === "live" ? "LIVE" : "TEST"}</span>` : ""}<p class="muted">${esc(m.buyers)}</p>${m.ready ? `<p class="muted">Through: <b>${esc(m.via)}</b></p>${m.partial ? `<p style="color:#8a5a00;margin:4px 0 0">For the PIN prompt, still missing — ${m.needs.map(esc).join("<br>")}</p>` : ""}` : `<p style="color:var(--red);margin:4px 0 0">Missing — ${m.needs.map(esc).join("<br>")}</p>`}</div>`).join("")}</div>`;
    const G = [["ai", "ai", "AI — quality reports, price guide, weight estimates and translations", "Paste your AI key here and press Save: it is stored encrypted, never shown again, and switches the features on immediately. Then open Providers → Test AI now to check it works. (Users never see which AI service is used.)"], ["jenga", "jenga", "Equity Bank (Jenga) — M-Pesa prompt settled straight into your Equity account", "Start in Sandbox. Enter your merchant code, consumer secret and API key from the Jenga console, and your Equity account number (the one customers' money is credited to). Then press “Generate signing keys” above and upload the public key to the console. Equity must also switch M-Pesa STK push on for your merchant code."], ["paystack", "paystack", "Paystack — M-Pesa and Airtel Money PIN prompts, and M-Pesa payouts", "Your Paystack Kenya account. Paste the secret key from Settings → API Keys & Webhooks (start with the TEST key), save the webhook address shown below in Paystack, and press Test connection. Payments stay in your Paystack balance until Sokoni releases them."], ["social", "social", "Google and Facebook sign-in — “Continue with Google / Facebook” buttons", "Optional. Each button appears for buyers and sellers as soon as its two values are saved. Both providers need your exact redirect address (shown under each field) — and your site must be on https."], ["fincra", "fincra", "Fincra — M-Pesa, Airtel Money and Equitel PIN prompts, and M-Pesa payouts", "Create a Fincra business account, then under Settings → API copy your Business ID, secret API key and webhook secret key here, whitelist this server's IP address, and register the webhook address shown below. Start in Sandbox and press Test connection."], ["sms", "sms", "SMS — sign-in codes", "Sign-in codes switch ON BY THEMSELVES once an SMS provider and an email provider are both connected and each has passed “Send a test” — until then people sign in with a password only, so you can skip this for now. Africa's Talking is best for Kenya and Africa; Twilio works worldwide."], ["email", "email", "Email — receipts for every payment, and sign-in codes", "Receipts are emailed to the address each person signed up with. Use Resend or SendGrid with a sender address on a domain you have verified."], ["flutterwave", "flutterwave", "Flutterwave — cards (including USD cards from the USA), M-Pesa, mobile money, bank. Start here.", "Create an account in Kenya, get the secret key under Settings → API keys, then register the webhook below."], ["wire", "wire", "International bank transfer (wire / ACH) — USD / EUR / GBP from abroad", "Enter the account that should receive foreign transfers (Wise Business, Payoneer or a Kenyan bank USD account). Buyers see these details with a unique reference."], ["paypal", "paypal", "PayPal — buyers in the USA, Europe, Brazil and ~200 markets", "Create a PayPal Business account (available in Kenya), then at developer.paypal.com create an app and copy its Client ID and secret. Start in Sandbox, switch to Live when ready."], ["crypto", "nowpayments", "Crypto / stablecoin (NOWPayments)", "Create a NOWPayments account, add your payout wallet there, then paste the API key and IPN secret."], ["mpesa", "mpesa", "M-Pesa direct (Safaricom Daraja) — needs a registered business with a Paybill or Till", "Optional while Flutterwave carries M-Pesa. Production needs Safaricom approval."], ["stripe", "stripe", "Stripe — not available as a direct account in Kenya", "Only fill in if you have a Stripe account from another country."]];
    const field = (f) => { const id = "f-" + f.key; let input; if (f.options) input = `<select id="${id}" data-key="${f.key}"><option value="">— ${f.set ? "keep current" : "choose"} —</option>${f.options.map((o, i) => `<option value="${esc(o)}"${f.value === o ? " selected" : ""}>${esc(f.labels ? f.labels[i] : o)}</option>`).join("")}</select>`;
      else if (f.multiline) input = `<textarea id="${id}" data-key="${f.key}" rows="3" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)">${esc(f.value)}</textarea>`;
      else input = `<input id="${id}" data-key="${f.key}" type="${f.secret ? "password" : "text"}" autocomplete="off" value="${esc(f.value)}" placeholder="${f.secret ? (f.set ? "saved " + esc(f.preview) + " — type to replace" : "paste here") : ""}" style="width:100%">`;
      return `<div style="margin:10px 0"><label style="font-weight:600;font-size:13px">${esc(f.label)}</label> ${f.set ? `<span class="chip g">set${f.source ? " · " + esc(f.source) : ""}</span>` : ""}${f.unreadable ? '<span class="chip r">saved value unreadable (SERVER_SECRET changed?)</span>' : ""}<div style="display:flex;gap:6px;margin-top:4px">${input}${f.generate ? `<button class="act ghost" type="button" onclick="genSecret('${f.key}')">Generate</button>` : ""}${f.source === "saved in the console" ? `<button class="act ghost" type="button" onclick="clearKey('${f.key}')">Clear</button>` : ""}</div>${f.hint ? `<div class="muted">${esc(f.hint)}</div>` : ""}</div>`; };
    const forms = G.map(([g, pid, title, note]) => { const comm = (r.comms || {})[pid], prov = r.providers.find((x) => x.id === pid) || { steps: comm ? comm.tips : [] }; return `<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(title)}</b>${dot(comm ? comm.configured : prov.configured)}${prov.mode ? `<span class="chip ${prov.mode === "live" ? "g" : "a"}">${prov.mode === "live" ? "LIVE keys" : "TEST keys"}</span>` : ""}</div><p class="muted">${esc(note)}</p>
      <div style="background:var(--bg);border-radius:10px;padding:8px 12px;margin:6px 0"><b>${comm ? "How to set it up" : "Register these addresses with the provider:"}</b><table>${prov.steps.map(([k, v]) => `<tr><td style="width:190px">${esc(k)}</td><td><code style="word-break:break-all">${esc(v)}</code> ${/^https?:\/\//.test(v) ? `<button class="act ghost" data-copy="${esc(v)}" onclick="copyText(this.dataset.copy)">Copy</button>` : ""}</td></tr>`).join("")}</table></div>
      <div data-group="${g}">${st.fields.filter((f) => f.group === g).map(field).join("")}</div><button class="act" onclick="saveGroup('${g}')">Save</button>${comm ? `<input id="nt-${pid}" placeholder="${pid === "sms" ? "+254712345678" : "you@example.com"}" style="max-width:230px;margin-left:8px"> <button class="act ghost" onclick="notifyTest('${pid}')">Send a test ${pid === "sms" ? "SMS" : "email"} to me</button>` : `<button class="act ghost" onclick="testProv('${pid}')">Test connection</button>`}<div id="tp-${pid}" style="margin-top:8px"></div></div>`; }).join("");
    return (st.canEncrypt ? "" : `<div class="note" style="background:#fff1dc;color:#8a5a00">⚠ <b>SERVER_SECRET isn't set</b> on this server, so secret keys can't be saved safely here. Set SERVER_SECRET (a long random value) in your host settings and restart, then come back.</div>`) + `<div class="note">Everything here is stored <b>encrypted</b> and never shown again — only “saved ••••1234”. Leave a secret box empty to keep the current value. After saving, use <b>Test connection</b>. The tiles show which buyer payment methods can already receive real money.</div>` + tiles + '<div id="eqCard" class="card"><b>Equity Bank — go-live checklist</b> <span class="muted">loading…</span></div>' + (setTimeout(loadEquity, 0), "") + '<div id="cryCard" class="card"><b>Crypto (USDC) — go-live checklist</b> <span class="muted">loading…</span></div>' + (setTimeout(loadCrypto, 0), "") + jengaKeysCard() + regionsCard(r.worldRegions) + forms; },
  async economics() {
    const d = await api("/economics?days=" + (S.ecoDays || 30)), m = (v) => money(v, "USD"), row = (l, v, hint) => `<tr><td>${l}${hint ? `<div class="muted">${hint}</div>` : ""}</td><td style="text-align:right;white-space:nowrap">${v}</td></tr>`;
    const meths = Object.entries(d.byMethod || {}).map(([k, v]) => `<tr><td>${esc({ mpesa: "M-Pesa", crypto: "Crypto", bank: "Bank transfer", card: "Card", paypal: "PayPal", none: "Test" }[k] || k)}</td><td>${v.orders}</td><td>${m(v.goodsUsd)}</td><td>${m(v.netUsd)}</td><td><span class="chip ${v.netPct >= d.targetPct ? "g" : "r"}">${v.netPct}%</span></td></tr>`).join("");
    return `<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>What Sokoni really keeps</b><span class="chip ${d.orders ? (d.netPct >= d.targetPct ? "g" : "r") : ""}">${d.orders ? "net " + d.netPct + "%" : "no finished orders yet"}</span><span class="chip">target ${d.targetPct}%</span><span class="chip">commission ${d.commissionPct}%</span>
      <span style="margin-left:auto">${[7, 30, 90, 365].map((n) => `<button class="act ${d.days === n ? "" : "ghost"}" onclick="S.ecoDays=${n};draw()">${n}d</button>`).join(" ")}</span></div>
      <p class="muted">Finished orders only (the seller has been paid). Gross commission is not profit: payment fees, payout fees and coin credits all come out of it.</p>
      ${d.warning ? `<div class="note" style="background:#fff1dc;color:#8a5a00">⚠ ${esc(d.warning)}</div>` : ""}
      ${d.orders ? `<table>${row("Goods sold", m(d.goodsUsd), d.orders + " orders")}${row("Commission + coin levy earned (gross)", m(d.grossUsd), "of which coin levy " + m(d.levyUsd))}${row("− Payment provider fees", m(d.costs.providerUsd), "what M-Pesa / crypto / bank / card providers take")}${row("− Payout fees", m(d.costs.payoutUsd), "sending money to sellers and riders")}${row("− Coin credits", m(d.costs.coinUsd), "fee discounts given to sellers")}${row("+ Rider cut", m(d.costs.riderCutUsd), "Sokoni's share of delivery fees (RIDER_CUT_PCT)")}${row("<b>Net kept</b>", `<b>${m(d.netUsd)} · ${d.netPct}%</b>`)}</table>
        ${d.recommendedCommissionPct ? `<p>For a ${d.targetPct}% net at these costs, the commission should be about <b>${d.recommendedCommissionPct}%</b> (it is ${d.commissionPct}%).</p>` : ""}
        <h4 style="margin:12px 0 4px">By how the buyer paid</h4><table><tr><th>Method</th><th>Orders</th><th>Goods</th><th>Net</th><th>Net %</th></tr>${meths}</table>` : `<p>Nothing to measure yet. Until orders finish, the app assumes costs of about <b>${d.assumedCostPct}%</b> of the goods value, which is why the commission is set to ${d.commissionPct}%.</p>`}
      <p class="muted" style="margin-top:10px">${esc(d.note)}</p></div>`;
  },
  async analytics() {
    const q = new URLSearchParams({ days: S.anDays == null ? 30 : S.anDays, country: S.anCountry || "", category: S.anCat || "" }), d = await api("/analytics?" + q), m = (v) => (v == null ? "—" : money(v, "USD")), n0 = (v) => (v == null ? "—" : Number(v).toLocaleString()), pc = (v) => (v == null ? "—" : v + "%");
    const bar = (v, max, c) => `<div style="background:#eee;border-radius:4px;height:8px;min-width:70px"><i style="display:block;height:8px;border-radius:4px;width:${max ? Math.max(2, (v / max) * 100) : 0}%;background:${c || "#1a7a4a"}"></i></div>`;
    const tbl = (head, rows) => (rows.length ? `<table><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>` : `<p class="muted">Nothing yet.</p>`);
    const card = (title, inner, note) => `<div class="card"><h3>${title}</h3>${note ? `<p class="muted" style="margin:0 0 6px">${note}</p>` : ""}${inner}</div>`, kpi = (label, val, hint) => `<div style="border:1px solid #e3e3dc;border-radius:10px;padding:10px"><small class="muted">${label}</small><div style="font-size:22px;font-weight:700">${val}</div>${hint ? `<div class="muted" style="font-size:12px">${hint}</div>` : ""}</div>`;
    const k = d.kpis, mx = (arr, f) => Math.max(1, ...arr.map((x) => x[f] || 0)), flag = (c) => esc(c || "?");
    const sr = d.series.slice(-90), smx = Math.max(1, ...sr.map((x) => x.gmvUsd)), W = 600, bw = sr.length ? W / sr.length : W;

async function convertUsdc() { const v = Number(document.getElementById("cvUsd").value), m = document.getElementById("cvMsg"); if (!(v > 0)) { m.innerHTML = '<span class="chip r">enter an amount</span>'; return; } try { await api("/crypto/convert", { method: "POST", body: JSON.stringify({ usd: v }) }); loadCrypto(); } catch (e) { m.innerHTML = `<span class="chip r">✗</span> ${esc(e.message)}`; } }
async function assignDeposit(did) { const q = prompt("Which order is this payment for? Type the order id (the first 6 or more characters are enough — shown on the order page as Order #…)"); if (!q) return; try { const r = await api("/equity/assign", { method: "POST", body: JSON.stringify({ depositId: did, orderId: q.trim() }) }); alert(r.ok ? "Applied — the order is now paid and held." : "Matched, but it needs a look (amount or order state): " + r.status); loadEquity(); } catch (e) { alert(e.message); } }
async function confirmPaybill(orderId, left) { const v = prompt("How much did you receive in the Equity account for this order? (Leave as it is if you received the full amount)", String(left)); if (v === null) return; try { const r = await api("/equity/paybill-confirm", { method: "POST", body: JSON.stringify({ orderId, amount: Number(v) }) }); alert(r.ok ? "Confirmed — the order is now paid and held safely." : "Recorded part of the payment (" + r.paid + " of " + r.due + "). The buyer must pay the rest."); loadEquity(); } catch (e) { alert(e.message); } }
async function downloadCsv(kind) { const r = await fetch("/api/admin/analytics/export?kind=" + kind, { headers: { "x-admin-token": S.tok } }); if (!r.ok) return alert("The export failed."); const b = await r.blob(), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "sokoni-" + kind + "-" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(a); a.click(); a.remove(); }
async function hideRating(id, hide) { let reason = ""; if (hide) { reason = prompt("Why are you hiding this rating? (kept on record)"); if (reason === null) return; } try { await api("/ratings/" + id + "/hide", { method: "POST", body: JSON.stringify({ hidden: hide, reason }) }); draw(); } catch (e) { alert(e.message); } }
async function runEquityCheck() { const el = document.getElementById("eqChk"); el.innerHTML = '<span class="muted">Checking with Equity…</span>'; try { const r = await api("/equity/check", { method: "POST", body: "{}" }); el.innerHTML = r.steps.map((x) => `<div>${x.ok ? "✅" : "❌"} ${esc(x.name)}${x.detail ? ` <span class="muted">— ${esc(x.detail)}</span>` : ""}</div>`).join("") + (r.ok ? '<div class="chip g" style="margin-top:6px">✓ everything checks out</div>' : ""); } catch (e) { el.innerHTML = `<span class="chip r">✗</span> ${esc(e.message)}`; } }
function jengaKeysCard() {
  return `<div class="card"><b>Equity Bank — signing keys</b><p class="muted">Equity requires every request to be <b>signed</b>. Press <b>Generate signing keys</b>: Sokoni makes the key pair and keeps the private half encrypted. Then copy the <b>public key</b> shown below and upload it in the Jenga console (API Keys). Do this once — creating new keys later means uploading again. (Needs SERVER_SECRET set on your host.)</p>
    <button class="act" onclick="jengaKeys(false)">Generate signing keys</button> <button class="act ghost" onclick="jengaShowKey()">Show my public key</button><div id="jkMsg" style="margin-top:8px"></div>
    <textarea id="jkPub" rows="7" readonly style="display:none;margin-top:8px;font-family:monospace;font-size:12px"></textarea><button id="jkCopy" class="act ghost" style="display:none;margin-top:6px" onclick="navigator.clipboard.writeText(document.getElementById('jkPub').value).then(()=>{this.textContent='Copied ✓'})">Copy public key</button></div>`;
}
function jengaShow(pub, msg) { const t = document.getElementById("jkPub"), c = document.getElementById("jkCopy"); if (pub) { t.value = pub; t.style.display = c.style.display = "block"; } document.getElementById("jkMsg").innerHTML = msg || ""; }
async function jengaKeys(force) { try { const r = await fetch("/api/admin/jenga/keys", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-token": S.tok }, body: JSON.stringify({ force }) }), d = await r.json();
  if (r.status === 409) { if (confirm(d.error)) return jengaKeys(true); return jengaShow(d.publicKey, "Kept your existing key."); } if (!r.ok) return jengaShow(null, `<span class="chip r">✗</span> ${esc(d.error || "Failed")}`);
  jengaShow(d.publicKey, '<span class="chip g">✓ keys created</span> Now copy the public key below into the Jenga console, then press <b>Test connection</b>.'); } catch (e) { jengaShow(null, `<span class="chip r">✗</span> ${esc(e.message)}`); } }
async function jengaShowKey() { try { const d = await api("/jenga/public-key"); jengaShow(d.publicKey, d.publicKey ? "" : esc(d.error || "No signing key yet — press Generate signing keys.")); } catch (e) { jengaShow(null, esc(e.message)); } }
async function loadClaimReceipts() { for (const img of document.querySelectorAll("img[data-claim]")) { try { const r = await fetch("/api/admin/mpesa/claims/" + img.dataset.claim + "/receipt", { headers: { "x-admin-token": S.tok } }); if (r.ok) img.src = URL.createObjectURL(await r.blob()); } catch (e) { /* none */ } } }
async function registerPaybill() { const el = document.getElementById("pbMsg"); el.innerHTML = '<span class="muted">Contacting Safaricom…</span>'; try { const r = await api("/mpesa/register", { method: "POST", body: "{}" }); el.innerHTML = r.ok ? `<span class="chip g">✓ registered</span> ${esc(r.detail)}` : `<span class="chip r">✗ not registered</span> ${esc(r.detail)}`; } catch (e) { el.innerHTML = `<span class="chip r">✗</span> ${esc(e.message)}`; } }
async function simulatePaybill() { const el = document.getElementById("pbMsg"), orderId = document.getElementById("simOrder").value.trim(); try { const r = await api("/mpesa/simulate", { method: "POST", body: JSON.stringify({ orderId }) }); el.innerHTML = r.ok ? '<span class="chip g">✓ simulated</span> the order should be held in a few seconds' : `<span class="chip r">✗</span> ${esc(r.detail || "failed")}`; } catch (e) { el.innerHTML = `<span class="chip r">✗</span> ${esc(e.message)}`; } }
async function assignPay(tid) { const orderId = document.getElementById("as-" + tid).value.trim(); try { await api(`/mpesa/payments/${tid}/assign`, { method: "POST", body: JSON.stringify({ orderId }) }); } catch (e) { alert(e.message); } draw(); }
async function resetPw(uid, name) { if (!confirm(`Reset the password for ${name}?\n\nOnly do this after you have checked who is asking. They will be logged out everywhere.`)) return; try { const r = await api(`/users/${uid}/reset-password`, { method: "POST", body: "{}" }); prompt(`Temporary password for ${name} — give it to them privately and ask them to change it right away (Account → Password). Shown once:`, r.temporary); } catch (e) { alert(e.message); } }
async function loadRiderPhotos() { for (const img of document.querySelectorAll("img[data-rider]")) { try { const r = await fetch("/api/admin/riders/" + img.dataset.rider + "/photo", { headers: { "x-admin-token": S.tok } }); if (r.ok) img.src = URL.createObjectURL(await r.blob()); } catch (e) { /* no photo */ } } }
async function reviewRider(uid, decision) { const note = decision === "reject" ? prompt("Reason shown to the rider (e.g. number plate not readable)") || "" : ""; if (decision === "reject" && !note) return; try { await api(`/riders/${uid}/review`, { method: "POST", body: JSON.stringify({ decision, note }) }); } catch (e) { alert(e.message); } draw(); }
async function testProv(id) { const el = document.getElementById("tp-" + id); el.innerHTML = '<span class="muted">Testing…</span>'; try { const r = await api("/provider-test", { method: "POST", body: JSON.stringify({ provider: id }) }); el.innerHTML = r.ok ? `<span class="chip g">✓ works</span> ${esc(r.detail)}` : `<span class="chip r">✗ failed</span> ${esc(r.error)}`; } catch (e) { el.innerHTML = `<span class="chip r">✗</span> ${esc(e.message)}`; } }
function copyText(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert("Copied"), () => prompt("Copy this:", t)); }
async function exportCsv() { const r = await fetch("/api/admin/export/payments.csv", { headers: { "x-admin-token": S.tok } }); if (!r.ok) return alert("Export failed"); const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = "sokoni-payments.csv"; a.click(); }
async function saveGroup(g) { const box = document.querySelector(`[data-group="${g}"]`), values = {}; box.querySelectorAll("[data-key]").forEach((el) => { if (el.value.trim()) values[el.dataset.key] = el.value.trim(); }); if (!Object.keys(values).length) return alert("Nothing to save — fill in at least one box."); try { await api("/settings", { method: "PUT", body: JSON.stringify({ values }) }); } catch (e) { return alert(e.message); } await draw(); alert("Saved. Now press Test connection."); }
async function clearKey(k) { if (!confirm("Remove the saved value for " + k + "? (If the host environment also sets it, that value is used again.)")) return; try { await api("/settings", { method: "PUT", body: JSON.stringify({ clear: [k] }) }); } catch (e) { alert(e.message); } draw(); }
function genSecret(k) { const a = new Uint8Array(24); crypto.getRandomValues(a); const el = document.getElementById("f-" + k); el.type = "text"; el.value = [...a].map((x) => x.toString(16).padStart(2, "0")).join(""); alert("Generated. COPY it now and paste the same value into the provider's dashboard where it asks for it — after you press Save it is hidden for good."); }
async function confirmWire(id, expected, cur) { const amount = prompt(`How much arrived? (${cur}) — expected ${expected}`, expected); if (amount === null) return; const bankReference = prompt("Bank / Wise transaction reference (optional)") || ""; try { await api(`/orders/${id}/confirm-transfer`, { method: "POST", body: JSON.stringify({ amount, currency: cur, bankReference }) }); alert("Confirmed — the order is now held for the workflow."); } catch (e) { alert(e.message); } draw(); }
async function retry(id) { try { await api(`/orders/${id}/retry-payout`, { method: "POST" }); } catch (e) { alert(e.message); } draw(); }
async function resolve(id, decision) { const note = prompt(decision === "release" ? "Note (optional) — release the held funds to the seller" : "Note (optional) — refund the buyer"); if (note === null) return; try { const r = await api(`/orders/${id}/resolve`, { method: "POST", body: JSON.stringify({ decision, note }) }); if (r.manualRefundRequired) alert("This payment method can't be refunded automatically (e.g. crypto / M-Pesa). Send the refund manually."); } catch (e) { alert(e.message); } draw(); }
async function review(id, decision) { const note = decision === "reject" ? prompt("Reason shown to the seller (optional)") || "" : ""; try { await api(`/listings/${id}/review`, { method: "POST", body: JSON.stringify({ decision, note }) }); } catch (e) { alert(e.message); } draw(); }
draw(); setInterval(() => { if (S.tok && !document.activeElement.matches("input")) draw(); }, 20000);

// Is this admin page from the same download as the server? (A mixed folder shows old screens with new data.)
(async () => { try { const m = await (await fetch("/api/meta")).json(), pg = (document.querySelector('meta[name="sokoni-build"]') || {}).content || "none", el = document.getElementById("bld"), w = document.getElementById("bldwarn"); if (el) el.textContent = "build " + (m.build || "?");
  if (m.build && pg !== m.build && w) { w.style.display = "block"; w.textContent = "Your admin page (build " + pg + ") and your server (build " + m.build + ") are from different downloads, so some screens are out of date. Copy ALL the files from the newest zip over your folder (keep your settings file and data folder), then restart."; } } catch (e) { /* offline: nothing to compare */ } })();
</script></body></html>
